name: Feature request
description: Suggest an improvement or a new integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Office and art
        - UI
        - Claude Code integration
        - Other agents
        - CLI
        - Docs
