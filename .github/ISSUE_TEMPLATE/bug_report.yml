name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. node bin/agent-office.js start\n2. ..."
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `node bin/agent-office.js doctor`
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11, Node 22.4, Chrome 130
    validations:
      required: true
