name: Demo site

# Publishes the web app as a static demo (simulated agents, no server).
# Needs a public repository (or a plan with private Pages) and
# Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - web/**
      - agents.example.json
      - .github/workflows/pages.yml
      - scripts/stamp-version.mjs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never stop a deploy halfway

jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # never publish a build that fails its own checks
      - run: node scripts/check.mjs
      - run: node scripts/test.mjs
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r web/. _site/
          cp agents.example.json _site/
          touch _site/.nojekyll
          # new URLs for every deploy, so browsers never mix cached old modules with new ones
          node scripts/stamp-version.mjs _site "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
